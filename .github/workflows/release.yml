name: Release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel

    - name: Extract version from setup.py
      id: get_version
      run: |
        VERSION=$(python setup.py --version)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Extracted Version: $VERSION"

    - name: Generate Commit Changelog
      id: changelog
      run: |
        echo "CHANGELOG<<EOF" >> $GITHUB_ENV
        
        # Get the latest tag name if it exists
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        
        if [ -z "$LATEST_TAG" ]; then
          echo "First GitHub release! Listing all commits:" >> $GITHUB_ENV
          git log --pretty=format:"* %s (%h)" >> $GITHUB_ENV
        else
          echo "Commits since $LATEST_TAG:" >> $GITHUB_ENV
          git log ${LATEST_TAG}..HEAD --pretty=format:"* %s (%h)" >> $GITHUB_ENV
        fi
        
        echo "" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Build Source and Wheel distributions
      run: python setup.py sdist bdist_wheel

    - name: Create GitHub Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: Release v${{ env.VERSION }}
        body: |
          ## What's Changed in this Release:
          ${{ env.CHANGELOG }}
        draft: false
        prerelease: false
        files: |
          dist/*.whl
          dist/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
